# The shop schema in sqlite, loaded with synthetic data.
#
#   bin/dbgen apply    -c examples/shop/sqlite.yaml --create-database
#   bin/dbgen generate -c examples/shop/sqlite.yaml --verify
database: "sqlite:shop.db"
schema: ../../tests/fixtures/shop.sqlite.sql

generation:
  seed: 7
  history_days: 90
  end_time: "2026-01-01"

tables:
  categories: 40
  customers: 2000
  products: 300
  orders: 20000
  order_lines: 50000
  countries: existing

columns:
  orders.channel: { values: [store, web, app], weights: [2, 5, 3] }
