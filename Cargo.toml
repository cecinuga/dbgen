[package]
name = "dbgen"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Database-agnostic, deterministic synthetic data generator: compiles SQL DDL, generates consistent rows and bulk-loads them into PostgreSQL, MySQL, SQLite or ClickHouse"
license = "UNLICENSED"
publish = false

[[bin]]
name = "dbgen"
path = "src/main.rs"

[lib]
name = "dbgen"
path = "src/lib.rs"

# One feature per connector, named after it, enabling its driver. A build without a
# connector cannot reach that database; the default build has them all.
[features]
default = ["clickhouse", "postgres", "mysql", "sqlite"]
clickhouse = ["dep:ureq"]
postgres = ["dep:postgres"]
mysql = ["dep:mysql"]
sqlite = ["dep:rusqlite"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossbeam-channel = "0.5"
ctrlc = "3.4"
indicatif = "0.17"
# Pure-Rust protocol and compression, no TLS: builds without OpenSSL headers.
mysql = { version = "26", default-features = false, features = ["minimal-rust"], optional = true }
postgres = { version = "0.19", optional = true }
# SQLite is compiled in, so no system library is needed.
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlparser = "0.64"
strsim = "0.11"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
ureq = { version = "2.12", optional = true }

# Each connector's integration tests need its feature.
[[test]]
name = "clickhouse"
required-features = ["clickhouse"]

[[test]]
name = "clickhouse_conformance"
required-features = ["clickhouse"]

[[test]]
name = "postgres"
required-features = ["postgres"]

[[test]]
name = "mysql"
required-features = ["mysql"]

[[test]]
name = "sqlite"
required-features = ["sqlite"]

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
