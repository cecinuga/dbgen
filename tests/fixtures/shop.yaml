# dbgen configuration for tests/fixtures/shop.sql. The integration tests override
# `database` with DBGEN_TEST_CLICKHOUSE_URL.
database: "http://dbgen:dbgen@localhost:18123/dbgen_shop_test"
schema: shop.sql

generation:
  seed: 7
  batch_size: 5000
  workers: 2
  history_days: 90
  end_time: "2026-01-01"

tables:
  customers: 2000
  products: 300
  orders: 20000
  order_lines: 50000
  countries: existing

relations:
  - "customers.country_code -> countries.code"

columns:
  orders.channel: { values: [store, web, app], weights: [2, 5, 3] }
  orders.status: { values: [new, paid, shipped, cancelled], weights: [1, 3, 5, 1] }
